name: Keep Render free instance awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 20 "$RENDER_URL/api/health" >/dev/null
          echo "awake: $RENDER_URL"
